name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-24.04 # ubuntu-latest pasó a 26.04 y Playwright aún no lo soporta (2026-11-14)

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # la versión sale de packageManager: CI = local (latest era pnpm 12 y no leía onlyBuiltDependencies)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:run

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2e tests
        run: pnpm test:e2e
