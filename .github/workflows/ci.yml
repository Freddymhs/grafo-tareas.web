name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-24.04 # ubuntu-latest pasó a 26.04 y Playwright aún no lo soporta (2026-11-14)

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # la versión sale de packageManager: CI = local (latest era pnpm 12 y no leía onlyBuiltDependencies)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:run

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2e tests
        run: pnpm test:e2e

  # FASE 27: con los tests en verde, el push a main queda en producción. Corre en el runner del Mac Mini el
  # deploy/desplegar-aqui.sh publicado del orquestador (el mismo que usa bin/desplegar a mano). Despliega todo junto e
  # idempotente: lo que no cambió no se reconstruye. El candado del script evita dos composes a la vez entre repos.
  deploy:
    name: Desplegar en el Mac Mini
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, mac-mini, grafo]
    # Un deploy colgado (2026-11-14: 35 min en `load metadata`) no retiene el runner las 6 h por defecto.
    timeout-minutes: 45
    steps:
      - name: deploy/desplegar-aqui.sh de origin/main del orquestador
        run: |
          # Sin pipefail, si `git show` falla `bash -s` lee un script vacío y el paso sale en verde sin desplegar.
          set -o pipefail
          git -C "$HOME/apps/grafo-tareas" fetch -q origin main
          git -C "$HOME/apps/grafo-tareas" show origin/main:deploy/desplegar-aqui.sh | bash -s
