# pnpm 10: en CI, un paquete con scripts de instalación no aprobado es ERR_PNPM_IGNORED_BUILDS (medido 2026-10-17).
# Estos tres los necesitan Next (sharp, unrs-resolver) y Vitest/Orval (esbuild). Nada más corre scripts al instalar.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

# zod <4.6.6 (alta: agota memoria con entradas enormes) llegaba por @serwist/*; el override acota solo esos tres.
overrides:
  "@serwist/build>zod": ">=4.6.6 <5"
  "@serwist/next>zod": ">=4.6.6 <5"
  "@serwist/webpack-plugin>zod": ">=4.6.6 <5"
